<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Premium Warm Terracotta & Deep Clay Linear Gradient -->
    <linearGradient id="gaClayGrad" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DE7948" />
      <stop offset="50%" stop-color="#B65D33" />
      <stop offset="100%" stop-color="#8F3E18" />
    </linearGradient>
    <!-- Subtle Golden Specular Rim -->
    <linearGradient id="gaRimGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <filter id="gaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0a182a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base Squircle / Rounded Architectural Token Shield -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#gaClayGrad)" filter="url(#gaShadow)" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="12.5" stroke="url(#gaRimGrad)" stroke-width="1" />

  <!-- Modern Geometric Architectural Pinnacle / Ascending "G & A" Chevron Motif -->
  <!-- Top Roofline Chevron -->
  <path d="M24 9 L37 22 L31.5 22 L24 14.5 L16.5 22 L11 22 Z" fill="#FFFFFF" />
  
  <!-- Second Tier Ascending Peak -->
  <path d="M24 17.5 L33 26.5 L28.5 26.5 L24 22 L19.5 26.5 L15 26.5 Z" fill="rgba(255, 255, 255, 0.88)" />

  <!-- Dynamic Strategic Forward Pillar (The 'Ahead' Compass Arrow) -->
  <path d="M22 24.5 H26 V37 H22 Z" rx="1.5" fill="#FFFFFF" />

  <!-- Horizontal Ground Truth Baseline (Stability & Property Foundation) -->
  <rect x="14" y="34.5" width="20" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.95)" />
  
  <!-- Subtle North-East Growth Compass Diamond at Apex -->
  <circle cx="24" cy="11" r="1.6" fill="#FFFFFF" />
</svg>
